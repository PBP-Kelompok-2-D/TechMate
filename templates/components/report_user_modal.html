<div id="report-user-modal"
     class="profile-modal"
     popover="auto"
     role="dialog"
     aria-modal="true"
     aria-labelledby="report-user-modal-title">
    <button type="button"
            class="profile-modal__backdrop"
            popovertarget="report-user-modal"
            popovertargetaction="hide"
            aria-label="Tutup form laporan"></button>

    <div class="profile-modal__content">
        <button type="button"
                class="profile-modal__close"
                popovertarget="report-user-modal"
                popovertargetaction="hide"
                aria-label="Tutup form laporan">×</button>

        <h2 id="report-user-modal-title" class="modal-title">Apakah Anda ingin melaporkan pengguna ini?</h2>
        <p class="profile-modal__desc">
            Anda akan melaporkan <strong>{{ viewed_user.username }}</strong>.
            Jelaskan alasan Anda pada kolom di bawah ini.
        </p>

        <form id="report-user-form"
              method="post"
              action="{% url 'main:report_user_ajax' profile.id %}"
              class="profile-form">
            {% csrf_token %}
            {% for field in report_form %}
                <div class="form-group">
                    <label for="{{ field.id_for_label }}">{{ field.label }}</label>
                    {{ field }}
                    {% for error in field.errors %}
                        <p class="form-error">{{ error }}</p>
                    {% endfor %}
                </div>
            {% endfor %}

            <div class="profile-modal__actions">
                <button type="button"
                        class="btn btn-ghost"
                        popovertarget="report-user-modal"
                        popovertargetaction="hide">Batal</button>
                <button type="submit" class="btn btn-primary">Kirim</button>
            </div>
        </form>
    </div>
</div>
