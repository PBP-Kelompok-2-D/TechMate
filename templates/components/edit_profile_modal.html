<div id="edit-profile-modal"
     class="profile-modal"
     popover="auto"
     role="dialog"
     aria-modal="true"
     aria-labelledby="edit-profile-modal-title">
    <button type="button"
            class="profile-modal__backdrop"
            popovertarget="edit-profile-modal"
            popovertargetaction="hide"
            aria-label="Tutup form edit profil"></button>

    <div class="profile-modal__content">
        <button type="button"
                class="profile-modal__close"
                popovertarget="edit-profile-modal"
                popovertargetaction="hide"
                aria-label="Tutup form edit profil">×</button>

        <h2 id="edit-profile-modal-title" class="modal-title">Edit Profil</h2>

        <form id="edit-profile-form"
              method="post"
              action="{% url 'main:edit_user_profile_ajax' profile.id %}"
              class="profile-form">
            {% csrf_token %}
            {% for field in edit_form %}
                <div class="form-group">
                    <label for="{{ field.id_for_label }}">{{ field.label }}</label>
                    {{ field }}
                    {% for error in field.errors %}
                        <p class="form-error">{{ error }}</p>
                    {% endfor %}
                </div>
            {% endfor %}

            <div class="profile-modal__actions">
                <button type="button"
                        class="btn btn-ghost"
                        popovertarget="edit-profile-modal"
                        popovertargetaction="hide">Batal</button>
                <button type="submit" class="btn btn-primary">Simpan</button>
            </div>
        </form>
    </div>
</div>
