{% extends 'base.html' %}
{% block meta %}
<title>Forum - {{ name }}</title>
{% endblock meta %}

{% block content %}
    <main>
        <div>
            {% for blog in blog_list %}
                <div>
                    <a href="{% url 'community:blog_detail' blog.slug %}">{{ blog }}</a>
                    <p>{{ blog.description }}</p>
                </div>

                {% empty %}
                <div> Belum ada blog</div>
                {% endfor %}
        </div>
    </main>
{% endblock content %}
