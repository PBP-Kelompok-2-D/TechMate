{% extends "base.html" %}

{% block meta %}
<title>Edit Profile - {{ name }}</title>
{% endblock meta %}

{% block content %}
<main class="auth-section">
    <div class="auth-box">
        <h1>Edit Profile</h1>
        
        <form method="post" action="{% url 'main:edit_user_profile' profile.id %}" class="auth-form">
            {% csrf_token %}
            {% for field in form %}
                <div class="form-group">
                    <label for="{{ field.id_for_label }}">{{ field.label }}</label>
                    {{ field }}
                    {% for error in field.errors %}
                        <p class="form-error">{{ error }}</p>
                    {% endfor %}
                </div>
            {% endfor %}

            <button type="submit" class="auth-submit-btn">Simpan Perubahan</button>
            <a href="{% url 'main:show_user_profile' profile.id %}" class="btn btn-ghost" style="text-align: center;">Batal</a>
        </form>
    </div>
</main>
{% endblock content %}
